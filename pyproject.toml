[project]
name = "omnistream"
version = "0.1.0"
description = "OmniStream RAG ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "neo4j>=5.26",
    "anthropic",
    "sentence-transformers",
    "rapidfuzz",
    "feedparser",
    "httpx",
    "beautifulsoup4",
    "pypdf",
    "pydantic>=2",
    "pydantic-settings",
    "python-multipart",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[neo4j]",
    "respx",
    "fpdf2",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnistream"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs Docker/Neo4j",
    "live: needs ANTHROPIC_API_KEY, costs money",
]
addopts = '-m "not integration and not live"'
