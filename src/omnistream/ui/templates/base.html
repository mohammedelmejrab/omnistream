<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OmniStream – {{ title }}</title>
<script src="/ui/static/htmx.min.js"></script><script src="https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js"></script><script src="/ui/static/omni.js"></script>
<style>body{font:16px system-ui;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#172b3a;background:#f7f9fb}nav{display:flex;gap:1.3rem;flex-wrap:wrap}a{color:#075a9c}label{display:block;margin:.8rem 0}input,select,textarea,button{font:inherit;padding:.5rem;max-width:100%;box-sizing:border-box}textarea{display:block;width:100%;min-height:6rem}button{cursor:pointer;background:#0c5679;color:white;border:0;border-radius:4px}select[multiple]{display:block;min-width:200px}.columns{display:flex;gap:1rem;flex-wrap:wrap}.columns>*{flex:1;min-width:200px}.card,article{padding:1rem;background:white;border:1px solid #d4dce2;margin:1rem 0}.graph{height:400px;border:1px solid #bccbd4;background:white}.answer-text,pre{white-space:pre-wrap;overflow-wrap:anywhere}.unverified{color:#9b3e00}.htmx-indicator{display:none}.htmx-request .htmx-indicator{display:inline}td,th{text-align:left;padding:.6rem;border-bottom:1px solid #ddd}dt{font-weight:bold}dd{margin-bottom:.4rem}</style></head>
<body><nav>{% for path,label in [('ask','Ask'),('bubbles','Bubbles'),('sources','Sources'),('unsorted','Unsorted'),('settings','Settings'),('eval','Eval')] %}<a href="/ui/{{ path }}">{{ label }}</a>{% endfor %}</nav><h1>{{ title }}</h1>{% block body %}{% endblock %}</body></html>
